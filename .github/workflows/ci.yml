name: Robot API CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: robot -d results features/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: robot-results
          path: results/
          retention-days: 7
